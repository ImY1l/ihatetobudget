version: "3"

services:
  ihatetobudget:
    build: .
    command: sh -c "pipenv run python manage.py collectstatic --noinput && pipenv run daphne -b 0.0.0.0 ihatetobudget.asgi:application"
    restart: always
    volumes:
      - .:/usr/src/app
      - static:/static
      - media_volume:/usr/src/app/media
    env_file: docker-compose.env
    environment:
      # Ensure HTTPS redirect is disabled because Caddy is currently HTTP-only (port 80)
      DJANGO_SECURE_SSL_REDIRECT: "False"
  caddy:

    image: caddy:2.0.0
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - static:/var/www/static
    depends_on:
      - ihatetobudget


volumes:
  caddy_data:
  static:
  media_volume:

