{% extends 'ihatetobudget/common/base.html' %}

{% load bootstrap4 %}

{% block title %}Sign in to IHateToBudget{% endblock %}

{% block body %}
  <div class="w-100 mx-auto" style="max-width: 22rem;">
    <h1 class="mb-4 text-center">Sign in</h1>
    <div class="card">
      <div class="card-body">
        <form action="{% url 'login' %}" method="post" class="form">
          {% csrf_token %}
          {% bootstrap_form form %}
          <button type="submit" class="btn btn-primary btn-block">
              <i class="fa fa-sign-in"></i> Sign In
          </button>
        </form>
      </div>
    </div>
    <div class="mt-1 text-center">
      <small>Don't have an account? <a href="https://github.com/bminusl/ihatetobudget">Host your own instance of IHateToBudget.</a></small>
    </div>
  </div>
{% endblock %}
