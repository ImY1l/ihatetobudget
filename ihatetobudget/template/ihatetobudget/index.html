{% extends 'ihatetobudget/common/base.html' %}

{% load static %}

{% block body %}
  <div class="jumbotron text-center">
    <h1 class="display-4 mb-3">
      <img src="{% static 'logo.png' %}" class="img-fluid" style="max-height: 125px;" alt="IHateToBudget" loading="lazy">
    </h1>
    <p class="lead">A simple web app to understand and control your expenses</p>
    <p class="lead">Designed to be self-hosted</p>
    <hr class="my-4">
    <p>IHateToBudget is released under the GPLv3.</p>
    <div class="mt-3">
      <a class="btn btn-primary btn-lg" href="https://github.com/bminusl/ihatetobudget" role="button">Learn more</a>
    </div>

    <div class="d-flex justify-content-center gap-2 mt-3">
      <a class="btn btn-success btn-lg" href="/sheets/register/" role="button">Register</a>
      <a class="btn btn-outline-primary btn-lg" href="/accounts/login/" role="button">Sign in</a>

    </div>

  </div>
{% endblock %}
